name: Validate browser and headless server
on:
  pull_request:
  push:
    branches: [feat/server-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r service/server-requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npx playwright install --with-deps chromium
      - run: node scripts/server-browser-test.mjs
        env:
          ALSHITASKS_TEST_PYTHON: python
      - run: docker build -f Dockerfile.server -t alshitasks-server:validation .
        if: runner.os == 'Linux'
