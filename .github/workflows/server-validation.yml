name: Validate browser and headless server
on:
  pull_request:
  push:
    branches: [main, feat/server-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r service/server-requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npx playwright install --with-deps chromium
      - run: node scripts/server-browser-test.mjs
        env:
          ALSHITASKS_TEST_PYTHON: python
      - name: Compare the browser with Electron
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install -y python3-jsonschema python3-pip libsecret-tools xvfb x11-utils
          vendor_python_version=$(/usr/bin/python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          /usr/bin/python3 -m pip install --break-system-packages --target "service/_vendor/$vendor_python_version" -r service/log-requirements.txt
          xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/server-browser-test.mjs
        env:
          ALSHITASKS_TEST_PYTHON: python
          ALSHITASKS_COMPARE_DESKTOP: '1'
      - run: docker build -f Dockerfile.server -t alshitasks-server:validation .
        if: runner.os == 'Linux'
