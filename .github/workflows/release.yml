name: Publish stable Windows and Linux release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: stable-desktop-release
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select unpublished stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/Alshival-Ai/alshitasks/releases?per_page=100' --slurp > /tmp/alshitasks-releases.json
          python3 scripts/release-version.py /tmp/alshitasks-releases.json
      - uses: astral-sh/setup-uv@v6
      - name: Build and test
        if: steps.version.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jsonschema libsecret-tools
          npm ci
          python3 scripts/check-workspace-art.py
          node scripts/startup-preference-test.cjs
          node --test scripts/updates-test.cjs
          uv pip install --python /usr/bin/python3 --target service/_vendor -r service/log-requirements.txt
          uv venv build/log-conformance
          mkdir -p build/cloud-contract-source
          tar -xzf contracts/cloud-api-source.tar.gz -C build/cloud-contract-source
          uv pip install --python build/log-conformance/bin/python ./build/cloud-contract-source 'anyio==4.11.0' jsonschema
          build/log-conformance/bin/python scripts/log-contract-test.py
          npm run validate
          npm run package:deb
          python3 scripts/package-upgrade-test.py build/alshitasks_*_amd64.deb
          cd build
          sha256sum alshitasks_*_amd64.deb > SHA256SUMS
      - name: Check packaged task board interactions
        if: steps.version.outputs.publish == 'true'
        run: |
          sudo apt-get install -y xvfb x11-utils ./build/alshitasks_*_amd64.deb
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks xvfb-run -a node scripts/updates-ui-test.mjs
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks xvfb-run -a node scripts/logs-desktop-test.mjs
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks xvfb-run -a node scripts/workspace-icons-test.mjs
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks xvfb-run -a node scripts/card-lifecycle-test.mjs
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/task-board-test.mjs
      - name: Check packaged tray and startup
        timeout-minutes: 5
        if: steps.version.outputs.publish == 'true'
        run: |
          ALSHITASKS_TEST_APP=/usr/lib/alshitasks ALSHITASKS_ISOLATED_BUS=1 dbus-run-session -- xvfb-run -a node scripts/tray-test.mjs
      - name: Retain failed board diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task-board-failure
          path: |
            /tmp/alshitasks-task-board-failure.png
            /tmp/alshitasks-task-board-trace.zip
            /tmp/alshitasks-card-failure.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: linux-package
          path: build/*.deb
  windows:
    needs: linux
    if: needs.linux.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test Windows
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          npm version $env:VERSION --no-git-tag-version --allow-same-version
          npm ci
          python -m pip install -r service/windows-requirements.txt
          node --test scripts/updates-test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-upgrade-test.py (Get-ChildItem build/windows/*_setup.exe | Select-Object -First 1).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-desktop-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ALSHITASKS_TEST_APP = (Resolve-Path build/windows/win-unpacked/resources/app).Path
          $env:ALSHITASKS_TEST_EXE = (Resolve-Path build/windows/win-unpacked/Alshival.Ai.exe).Path
          node scripts/updates-ui-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/logs-desktop-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/workspace-icons-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/card-lifecycle-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/windows/*_setup.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-diagnostics
          path: build/windows-desktop.png
          if-no-files-found: ignore
  server-checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r service/server-requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: npx playwright install --with-deps chromium
      - run: node scripts/server-browser-test.mjs
        env:
          ALSHITASKS_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-browser-${{ matrix.os }}
          path: build/server-*.png
          if-no-files-found: ignore
  server-image:
    needs: [linux, windows, server-checks]
    if: needs.linux.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ needs.linux.outputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ghcr.io/alshival-ai/alshitasks-server:v${{ needs.linux.outputs.version }}
            ghcr.io/alshival-ai/alshitasks-server:latest
            ghcr.io/alshival-ai/alshitasks-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Alshival-Ai/alshitasks
            org.opencontainers.image.revision=${{ github.sha }}
  release:
    needs: [linux, windows, server-checks, server-image]
    if: needs.linux.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: build
      - name: Publish immutable version after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd build
          sha256sum *.deb *.exe > SHA256SUMS
          gh release create "v$VERSION" "alshitasks_${VERSION}_amd64.deb" "alshitasks_${VERSION}_x64_setup.exe" SHA256SUMS \
            --target "$GITHUB_SHA" --title "Alshival.Ai $VERSION" \
            --notes "Windows x64 installer, Ubuntu amd64 package, and headless browser/MCP server image ghcr.io/alshival-ai/alshitasks-server:v$VERSION. Server setup: https://github.com/Alshival-Ai/alshitasks/blob/main/docs/server.md . Existing per-user desktop data is retained on upgrades. Relaunch the app to load updated desktop code."
