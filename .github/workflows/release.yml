name: Publish stable Debian release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-debian-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select unpublished stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/Alshival-Ai/alshitasks/releases?per_page=100' --slurp > /tmp/alshitasks-releases.json
          python3 scripts/release-version.py /tmp/alshitasks-releases.json
      - name: Build and test
        if: steps.version.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jsonschema libsecret-tools
          npm ci
          npm run validate
          npm run package:deb
          cd build
          sha256sum alshitasks_*_amd64.deb > SHA256SUMS
      - name: Publish immutable version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" "build/alshitasks_${VERSION}_amd64.deb" build/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Alshival.Ai $VERSION" \
            --notes "Stable Ubuntu amd64 desktop package. Install with apt install ./alshitasks_${VERSION}_amd64.deb. Existing per-user data is retained. Relaunch the app to use updated desktop code."
